[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-search"
version = "0.1.0"
description = "MCP server for AI model search capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Auth challenges and pre-dispatch session errors are a tested wire contract.
    # Upgrade these together and rerun the real-SDK auth/session regressions.
    "fastmcp==3.4.5",
    "httpx[socks]>=0.28.0",
    "mcp[cli]==1.29.0",
    "starlette==1.3.1",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grok-search = "grok_search.server:main"
grok-search-tavily-probe = "grok_search.tavily_boundary_probe:main"
